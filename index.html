function buscar(){
  var q = (document.getElementById('q').value || '').trim();
  if (!q) return;
  notaBusqueda = null;
  busquedaActual = { orig: q, iaUsada: false };

  var meta = metaComuna(ciudad);
  var ciudadTxt = meta.txt;
  var borderCol = meta.border;
  var allCuads = initCuadrantesCache();

  // 1. Búsqueda directa por número o código de cuadrante
  var m = q.match(/^\s*(?:(?:cuadrante|cuad|sector|tenencia|reten|n[°º.]?)\s*)?(\d{1,2}|sra|srb|src|srd|pai-1|pai-2|paihuano|pisco\s*elqui|and-1|andacollo)\s*$/i);
  if (m) {
    var raw = m[1].toLowerCase().replace(/\s+/g,'');
    
    // Buscar en la comuna actual
    var it = items.find(function(p){
      var nStr = String(p.n).toLowerCase().replace(/\s+/g,'');
      var codStr = String(p.cod || '').toLowerCase().replace(/\s+/g,'');
      var secStr = String(p.sector || '').toLowerCase();
      return nStr === raw || codStr === raw || secStr.indexOf(raw) !== -1;
    });

    // Buscar si también existe en otras comunas
    var otrasAlternativas = [];
    var comunasKeys = ['coquimbo','serena','vicuna','paihuano','andacollo'];
    comunasKeys.forEach(function(ck){
      if (ck !== ciudad) {
        var matchOther = allCuads[ck].find(function(p){
          var nStr = String(p.n).toLowerCase().replace(/\s+/g,'');
          var codStr = String(p.cod || '').toLowerCase().replace(/\s+/g,'');
          var secStr = String(p.sector || '').toLowerCase();
          return nStr === raw || codStr === raw || secStr.indexOf(raw) !== -1;
        });
        if (matchOther) {
          otrasAlternativas.push({ comuna: ck, cuad: matchOther });
        }
      }
    });

    if (it) {
      map.fitBounds(it.layer.getBounds().pad(0.2));
      it.layer.openPopup();
      document.getElementById('resultado').style.borderLeftColor = borderCol;
      var html = '<div class="res-card">' +
        '<div class="res-title-row">' +
          '<span class="res-icon">👮</span>' +
          '<span class="res-title"><b>Cuadrante / Sector: ' + (/^\d+$/.test(it.n) ? 'N° ' : '') + it.n + '</b> · ' + ciudadTxt + '</span>' +
          '<button class="res-close-btn" onclick="cerrarResultado()" title="Cerrar">✕</button>' +
        '</div>' +
        '<div class="res-body">' +
          '<div style="font-size:13px;margin-bottom:6px;color:#374151;">' + it.sector + '</div>' +
          '<div>Teléfono patrulla: ' + telLink(it.tel) + '</div>';

      if (otrasAlternativas.length > 0) {
        html += '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #e5e7eb;font-size:12.5px;color:#4b5563;">' +
          '💡 <b>También existe en:</b> ';
        otrasAlternativas.forEach(function(oa, oi){
          var mo = metaComuna(oa.comuna);
          html += (oi > 0 ? ' · ' : '') + '<a href="javascript:void(0)" onclick="cambiarComunaYBuscar(\'' + oa.comuna + '\', \'' + escapeHtml(q) + '\')" style="color:' + mo.border + ';font-weight:700;text-decoration:underline;">' + mo.txt + '</a>';
        });
        html += '</div>';
      }

      html += '</div></div>';
      res(html);
    } else {
      if (otrasAlternativas.length > 0) {
        var primeraOtra = otrasAlternativas[0];
        var mo = metaComuna(primeraOtra.comuna);
        var html = '<div class="res-card">' +
          '<div class="res-title-row">' +
            '<span class="res-icon">⚠️</span>' +
            '<span class="res-title">No se encuentra en ' + ciudadTxt + '</span>' +
            '<button class="res-close-btn" onclick="cerrarResultado()" title="Cerrar">✕</button>' +
          '</div>' +
          '<div class="res-body">' +
            '<p style="margin:4px 0 8px 0;">No se encontró el cuadrante "' + escapeHtml(q) + '" en ' + ciudadTxt + ', pero está disponible en <b>' + mo.txt + '</b>.</p>' +
            '<button type="button" class="btn-buscar-alt" onclick="cambiarComunaYBuscar(\'' + primeraOtra.comuna + '\', \'' + escapeHtml(q) + '\')" style="padding:7px 12px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;font-weight:700;color:#166534;cursor:pointer;">👉 Ver ' + (/^\d+$/.test(primeraOtra.cuad.n)?'Cuadrante N° ':'') + primeraOtra.cuad.n + ' en ' + mo.txt + '</button>' +
          '</div></div>';
        res(html);
      } else {
        res('<div class="res-card res-card-notfound">' +
          '<div class="res-title-row">' +
            '<span class="res-icon">❌</span>' +
            '<span class="res-title">No se encuentra cuadrante en ' + ciudadTxt + '</span>' +
            '<button class="res-close-btn" onclick="cerrarResultado()" title="Cerrar">✕</button>' +
          '</div>' +
          '<div class="res-body"><p style="margin:4px 0;">No se encontró el cuadrante o sector "' + escapeHtml(q) + '" en ' + ciudadTxt + '.</p></div></div>');
      }
    }
    return;
  }

  // 2. Motor de direcciones: correcciones, limpieza, IA, esquinas,
  //    numeración exacta, ortografía, lugares (ver MOTOR DE DIRECCIONES).
  resolverDireccion(q);
}

// Búsqueda por nombre de calle (sin numeración exacta): catálogo, base de
// calles, hitos de avenidas y, por último, Nominatim.
function buscarCalle(q, yaCorregida){
  var allCuads = initCuadrantesCache();

  // 3. Comprobación instantánea de calles: catálogo curado + base COMPLETA de
  //    calles de OSM (todas las comunas/cuadrantes donde exista la calle).
  var localCommon = mergeMapSugs(buscarCallesMulticomuna(q), dbHitsToMapSugs(q));
  if (localCommon && localCommon.length > 0) {
    // Priorizar la comuna actual del selector
    localCommon.sort(function(a, b){
      if (a.comuna === ciudad && b.comuna !== ciudad) return -1;
      if (b.comuna === ciudad && a.comuna !== ciudad) return 1;
      return 0;
    });

    window.currentQuery = q;
    window.currentAlternativas = localCommon;

    seleccionarAlternativa(0);
    renderAlternativasUI(q, localCommon, 0);
    return;
  }

  // 3. Comprobación instantánea con tabla de hitos (0 ms) para grandes arterias y numeración exacta
  var milestoneHit = checkMilestone(q, ciudad);
  if (milestoneHit) {
    var targetList = allCuads[milestoneHit.comuna] || [];
    var matchedCuad = null;
    for (var mi = 0; mi < targetList.length; mi++) {
      if (enItem(milestoneHit.lat, milestoneHit.lng, targetList[mi])) {
        matchedCuad = targetList[mi];
        break;
      }
    }
    if (!matchedCuad && targetList.length) {
      matchedCuad = targetList.find(function(c){ return String(c.cod) === String(milestoneHit.cuadN); }) || targetList[0];
    }

    if (matchedCuad) {
      var altDirecta = [{
        comuna: milestoneHit.comuna,
        cuad: matchedCuad,
        cuadTxt: (/^\d+$/.test(matchedCuad.n) ? 'Cuadrante N° ' + matchedCuad.n : matchedCuad.sector),
        lat: milestoneHit.lat,
        lng: milestoneHit.lng,
        display: milestoneHit.street + (milestoneHit.num ? ' ' + milestoneHit.num : '') + ' (' + milestoneHit.desc + ')',
        displayRoad: milestoneHit.street + (milestoneHit.num ? ' ' + milestoneHit.num : '')
      }];

      // Si la arteria también existe en otra comuna (ej. Balmaceda en Coquimbo / Las Compañías), buscar alternativas
      var comunasKeys2 = ['coquimbo','serena','vicuna','paihuano','andacollo'];
      comunasKeys2.forEach(function(ck){
        if (ck !== milestoneHit.comuna) {
          var otherM = checkMilestone(q, ck);
          if (otherM && otherM.comuna === ck) {
            var otherList = allCuads[ck] || [];
            var otherCuad = otherList.find(function(c){ return enItem(otherM.lat, otherM.lng, c); });
            if (otherCuad) {
              altDirecta.push({
                comuna: ck,
                cuad: otherCuad,
                cuadTxt: (/^\d+$/.test(otherCuad.n) ? 'Cuadrante N° ' + otherCuad.n : otherCuad.sector),
                lat: otherM.lat,
                lng: otherM.lng,
                display: otherM.street + (otherM.num ? ' ' + otherM.num : '') + ' (' + otherM.desc + ')',
                displayRoad: otherM.street + (otherM.num ? ' ' + otherM.num : '')
              });
            }
          }
        }
      });

      window.currentQuery = q;
      window.currentAlternativas = altDirecta;

      seleccionarAlternativa(0);
      renderAlternativasUI(q, altDirecta, 0);
      return;
    }
  }

  // 4. Lugares por nombre (SAPU, colegios, malls…) y calle mal escrita.
  res('<div class="res-loading"><span class="res-loading-spinner"></span> Buscando lugar o dirección…</div>');
  geoLugar(q, ciudad).then(function(lugares){
    if (lugares.length) { renderAlternativasUI(q, lugares, 0); return; }
    var corr = !yaCorregida && corregirCalle(q, comunaEnTexto(q) || ciudad);
    if (corr) {
      if (!notaBusqueda) notaBusqueda = '🔤 Quisiste decir: <b>' + escapeHtml(corr.nombre) + '</b>';
      buscarCalle(corr.nombre, true);
      return;
    }
    buscarNominatim(q);
  });
}

// 5. Búsqueda geocodificada en Nominatim con protección contra bloqueos
function buscarNominatim(q){
  var allCuads = initCuadrantesCache();
  var ciudadOrig = ciudad;
  var metaOrig = metaComuna(ciudadOrig);
  var comunas = ['coquimbo','serena','vicuna','paihuano','andacollo'];

  res('<div class="res-loading"><span class="res-loading-spinner"></span> Buscando dirección y avenidas en la comuna…</div>');

  // Temporizador maestro de seguridad para evitar que la interfaz se quede pegada
  var safetyTimer = setTimeout(function(){
    mostrarNoEncontrado(q, ciudadOrig);
  }, 3800);

  fetchNominatim(q, ciudadOrig).then(function(js){
    clearTimeout(safetyTimer);

    if (!Array.isArray(js) || !js.length) {
      mostrarNoEncontrado(q, ciudadOrig);
      return;
    }

    var alternativas = [];
    var seenKeys = {};

    // Clasificación y puntuación de candidatos para priorizar la comuna seleccionada
    var scoredCandidates = [];
    for (var r = 0; r < js.length; r++) {
      var cLat = parseFloat(js[r].lat), cLng = parseFloat(js[r].lon);
      if (isNaN(cLat) || isNaN(cLng)) continue;

      var score = 0;
      var cAddr = js[r].address || {};
      var cType = js[r].type || '';
      var cClass = js[r].class || '';

      // Priorizar arterias principales sobre pasajes peatonales
      if (cType === 'primary' || cType === 'secondary' || cType === 'trunk') score += 40;
      if (cType === 'tertiary' || cType === 'residential') score += 20;
      if (cType === 'living_street') score -= 20;

      // Priorizar coincidencia de comuna
      var displayLow = (js[r].display_name || '').toLowerCase();
      if (displayLow.indexOf(metaOrig.txt.toLowerCase()) !== -1) score += 100;

      scoredCandidates.push({ hit: js[r], lat: cLat, lng: cLng, score: score });
    }

    scoredCandidates.sort(function(a, b){ return b.score - a.score; });

    for (var s = 0; s < scoredCandidates.length; s++) {
      var itemCand = scoredCandidates[s];
      var lat = itemCand.lat, lng = itemCand.lng;
      var hit = itemCand.hit;
      var addr = hit.address || {};
      var roadName = addr.road || addr.pedestrian || addr.footway || addr.path || addr.suburb || '';
      var locName = addr.neighbourhood || addr.suburb || addr.city_district || addr.village || addr.town || addr.city || '';
      var shortDisplay = roadName ? (roadName + (locName ? ', ' + locName : '')) : (hit.display_name ? hit.display_name.split(',').slice(0, 3).join(',') : q);

      for (var c = 0; c < comunas.length; c++) {
        var comKey = comunas[c];
        var list = allCuads[comKey] || [];
        for (var k = 0; k < list.length; k++) {
          if (enItem(lat, lng, list[k])) {
            var uniqueKey = comKey + '_' + list[k].cod;
            if (!seenKeys[uniqueKey]) {
              seenKeys[uniqueKey] = true;
              alternativas.push({
                comuna: comKey,
                cuad: list[k],
                cuadTxt: (/^\d+$/.test(list[k].n) ? 'Cuadrante N° ' + list[k].n : list[k].sector),
                lat: lat,
                lng: lng,
                display: hit.display_name || (shortDisplay + ', ' + metaComuna(comKey).txt),
                displayRoad: shortDisplay
              });
            }
            break;
          }
        }
      }
    }

    if (!alternativas.length) {
      mostrarNoEncontrado(q, ciudadOrig, js[0]);
      return;
    }

    // Ordenar alternativas dando preferencia a la comuna seleccionada actualmente
    alternativas.sort(function(a, b){
      if (a.comuna === ciudadOrig && b.comuna !== ciudadOrig) return -1;
      if (b.comuna === ciudadOrig && a.comuna !== ciudadOrig) return 1;
      return 0;
    });

    window.currentQuery = q;
    window.currentAlternativas = alternativas;

    var comunasDistintas = [];
    alternativas.forEach(function(a){
      if (comunasDistintas.indexOf(a.comuna) === -1) comunasDistintas.push(a.comuna);
    });

    seleccionarAlternativa(0);
    renderAlternativasUI(q, alternativas, 0);
  }).catch(function(err){
    clearTimeout(safetyTimer);
    console.warn('Excepción al buscar dirección:', err);
    mostrarNoEncontrado(q, ciudadOrig);
  });
}

  if(pin){ map.removeLayer(pin); pin=null; }

// Soporte para parámetros URL directos (?q=...&ciudad=...)
(function checkUrlParams() {
  try {
    var sp = new URLSearchParams(window.location.search);
    var qParam = sp.get('q') || sp.get('buscar') || sp.get('direccion');
    var ciudadParam = sp.get('ciudad') || sp.get('comuna');
    var sel = document.getElementById('ciudad');
    
    if (ciudadParam && sel) {
      var val = ciudadParam.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      if (val.indexOf('serena') !== -1) sel.value = 'serena';
      else if (val.indexOf('vicun') !== -1) sel.value = 'vicuna';
      else if (val.indexOf('paih') !== -1) sel.value = 'paihuano';
      else if (val.indexOf('andac') !== -1) sel.value = 'andacollo';
      else sel.value = 'coquimbo';
      dibujar(sel.value);
    }
    
    // Deep-link preciso: si vienen coordenadas exactas (?lat=..&lng=..), posiciona
    // el pin directamente en el cuadrante correcto (usado por el buscador de index.html).
    var latParam = parseFloat(sp.get('lat'));
    var lngParam = parseFloat(sp.get('lng'));
    if (!isNaN(latParam) && !isNaN(lngParam)) {
      var allC = initCuadrantesCache();
      var comunasK = ['serena','coquimbo','vicuna','paihuano','andacollo'];
      var foundCuad = null, foundComuna = null;
      for (var ci = 0; ci < comunasK.length; ci++) {
        var lst = allC[comunasK[ci]] || [];
        for (var ki = 0; ki < lst.length; ki++) {
          if (enItem(latParam, lngParam, lst[ki])) { foundCuad = lst[ki]; foundComuna = comunasK[ci]; break; }
        }
        if (foundCuad) break;
      }
      var comunaFinal = foundComuna || (sel && sel.value) || 'coquimbo';
      if (sel) sel.value = comunaFinal;
      dibujar(comunaFinal);
      var displayTxt = qParam || (foundCuad ? foundCuad.sector : 'Ubicación');
      var altPreciso = {
        comuna: comunaFinal,
        lat: latParam,
        lng: lngParam,
        cuad: foundCuad || { n: '', cod: '', tel: '', sector: displayTxt },
        cuadTxt: foundCuad ? (/^\d+$/.test(String(foundCuad.n)) ? 'Cuadrante N° ' + foundCuad.n : foundCuad.sector) : 'Cuadrante',
        display: displayTxt,
        displayRoad: displayTxt
      };
      var qi = document.getElementById('q');
      if (qi && qParam) qi.value = qParam;
      setTimeout(function(){ renderAlternativasUI(displayTxt, [altPreciso], 0); }, 300);
      return;
    }

    if (qParam) {
      var qInput = document.getElementById('q');
      if (qInput) {
        qInput.value = qParam;
        if (!ciudadParam && sel) {
          var qNorm = qParam.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          if (qNorm.indexOf('serena') !== -1 || qNorm.indexOf('compania') !== -1) {
            sel.value = 'serena';
            dibujar('serena');
          } else if (qNorm.indexOf('vicun') !== -1) {
            sel.value = 'vicuna';
            dibujar('vicuna');
          } else if (qNorm.indexOf('paih') !== -1 || qNorm.indexOf('pisco') !== -1) {
            sel.value = 'paihuano';
            dibujar('paihuano');
          } else if (qNorm.indexOf('andac') !== -1) {
            sel.value = 'andacollo';
            dibujar('andacollo');
          }
        }
        setTimeout(function() {
          buscar();
        }, 300);
      }
    }
  } catch (err) {
    console.warn('Error procesando parámetros URL:', err);
  }
})();
